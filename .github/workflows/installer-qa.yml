name: Isolated signed installer QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  upgrade:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.86.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-worker
          path: output/worker/wangai-worker
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build-test-installers.ps1 -SkipWorker
        shell: pwsh
      - run: python scripts/test-installed-upgrade.py --install-test-product
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: isolated-upgrade-result
          # Never upload the temporary private signing key.
          path: output/release-test/upgrade-result.json
          retention-days: 7
