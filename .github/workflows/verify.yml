name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check automation syntax
        run: |
          node --check .github/scripts/linear-status-sync.mjs
          node --check .github/scripts/discord-main-merge.mjs
      - name: Test automation without credentials or network access
        run: node --test .github/scripts/*.test.mjs
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.86.0'
          components: rustfmt
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo fmt --manifest-path portable/Cargo.toml --check
      - run: cargo fmt --manifest-path ../../ai-protocol/Cargo.toml --check
      - run: node scripts/prepare-release.mjs --check-version
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features local-stt
      - run: cargo test --locked --manifest-path portable/Cargo.toml --features host
      - run: ./scripts/package-worker.ps1
        shell: pwsh
      - name: Check packaged Python worker events with the real Rust decoder
        shell: pwsh
        run: |
          $env:WANGAI_TEST_WORKER_EXE = (Resolve-Path 'output/worker/wangai-worker/wangai-worker.exe').Path
          cargo test --locked --manifest-path src-tauri/Cargo.toml packaged_worker_events_follow_rust_contract -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: .packaging-venv/Scripts/python.exe -m unittest discover -s worker -v
      - name: Build pinned CPU Whisper and verify the real model
        shell: pwsh
        run: |
          ./scripts/setup-whisper.ps1 -Python .packaging-venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .packaging-venv/Scripts/python.exe -m unittest discover -s worker -p test_whisper_worker.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .packaging-venv/Scripts/python.exe scripts/test-whisper-bundle.py output/whisper-build/Release output/models/ggml-base-q5_1.bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: .packaging-venv/Scripts/python.exe scripts/test-portable-preview.py
      - run: .packaging-venv/Scripts/python.exe scripts/test-package-portable.py
      - run: node scripts/desktop-licenses.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-worker
          path: apps/desktop/output/worker/wangai-worker/
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-whisper
          path: |
            apps/desktop/output/whisper-build/Release/wangai-whisper.exe
            apps/desktop/output/whisper-build/Release/LICENSE-whisper.cpp.txt
            apps/desktop/output/models/ggml-base-q5_1.bin
          if-no-files-found: error
          retention-days: 3
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.86.0'
          components: rustfmt
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: python3 scripts/test-server-container.py
