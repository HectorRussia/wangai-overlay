name: Portable Preview (no publish)
on:
  push:
    branches: ['codex/portable-preview-0.3.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'HectorRussia/wangai-overlay' && github.ref == 'refs/heads/codex/portable-preview-0.3.0'
    uses: ./.github/workflows/verify.yml
  package:
    if: github.repository == 'HectorRussia/wangai-overlay' && github.ref == 'refs/heads/codex/portable-preview-0.3.0'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.22'
      - run: uv venv --python 3.12 --managed-python .packaging-venv
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.86.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-worker
          path: output/worker/wangai-worker
      - run: pnpm install --frozen-lockfile
      - name: Build and sign preview using existing secrets
        shell: pwsh
        env:
          WANGAI_API_BASE_URL: ${{ vars.WANGAI_API_BASE_URL }}
          WANGAI_UPDATER_PUBLIC_KEY: ${{ vars.WANGAI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WANGAI_API_BASE_URL.TrimEnd('/') -ne 'https://wangai-ai.onrender.com') { throw 'Preview must use the live WANGAI gateway' }
          foreach ($name in @('WANGAI_UPDATER_PUBLIC_KEY','TAURI_SIGNING_PRIVATE_KEY','TAURI_SIGNING_PRIVATE_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing required signing input: $name" }
          }
          ./scripts/build-portable.ps1 -OutputRoot output/portable-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify production identity, signatures and record preview provenance
        shell: pwsh
        env:
          WANGAI_API_BASE_URL: ${{ vars.WANGAI_API_BASE_URL }}
          WANGAI_UPDATER_PUBLIC_KEY: ${{ vars.WANGAI_UPDATER_PUBLIC_KEY }}
        run: |
          .packaging-venv/Scripts/python.exe scripts/verify-portable-artifacts.py output/portable-preview/release --verifier portable/target/release/portable-verify.exe --production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .packaging-venv/Scripts/python.exe scripts/record-portable-preview.py output/portable-preview/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .packaging-venv/Scripts/python.exe scripts/verify-portable-artifacts.py output/portable-preview/release --verifier portable/target/release/portable-verify.exe --production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified preview only (no tag or release)
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WANGAI-portable-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/portable-preview/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Show preview download and remaining checks
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          @"
          ## WANGAI Portable preview - not published
          [Download signed preview artifact]($env:PREVIEW_URL)

          Built from commit $env:GITHUB_SHA using the live WANGAI gateway and existing signing secrets.
          No tag, draft, published release, or updater channel was changed.
          Clean Windows, first launch of this exact artifact and live translation still need validation.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
