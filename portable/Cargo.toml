[package]
name = "wangai-portable"
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
build = "build.rs"

[features]
default = []
host = ["dep:sysinfo"]
release-test = []
tools = []

[[bin]]
name = "WANGAI"
path = "src/main.rs"
required-features = ["host"]

[[bin]]
name = "portable-verify"
path = "src/verify.rs"
required-features = ["tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
fs2 = "0.4"
memmap2 = "0.9"
minisign-verify = "=0.2.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.35.2", default-features = false, features = ["system"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"
