[package]
name = "gamelingo"
version = "0.1.0"
description = "Near-realtime game voice translator overlay"
authors = ["GameLingo"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "gamelingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4.45", features = ["serde"] }
flexaudio = "0.2.0"
futures-util = "0.3"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
regex = "1.12"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.35.2", default-features = false, features = ["system"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23"
